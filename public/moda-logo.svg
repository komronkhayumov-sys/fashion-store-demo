<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Luxury Obsidian / Royal Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Platinum White Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Rim -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Inner Delicate Border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />

  <!-- Center Decorative Glow Circle -->
  <circle cx="256" cy="220" r="140" fill="#2563EB" fill-opacity="0.08" filter="url(#goldGlow)" />

  <!-- Luxury Monogram "M" -->
  <g transform="translate(256, 215) scale(1.15)">
    <!-- Architectural Stylized Fashion M -->
    <path d="M-85,90 L-85,-75 L-40,-75 L0,-10 L40,-75 L85,-75 L85,90 L52,90 L52,-15 L22,35 L-22,35 L-52,-15 L-52,90 Z" 
          fill="url(#goldGrad)" 
          filter="url(#goldGlow)" />
    
    <!-- Central Diamond Accent -->
    <polygon points="0,-45 12,-65 0,-85 -12,-65" fill="#FDE68A" />
  </g>

  <!-- Brand Typography -->
  <!-- "MODA" -->
  <text x="256" y="390" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', 'Didot', 'Times New Roman', serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="14" 
        fill="url(#platinumGrad)">
    MODA
  </text>

  <!-- "UZ • PREMIUM STORE" Subtitle -->
  <text x="256" y="425" 
        text-anchor="middle" 
        font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
        font-size="14" 
        font-weight="800" 
        letter-spacing="8" 
        fill="url(#goldGrad)">
    UZ • PREMIUM STORE
  </text>

  <!-- Subtle Accent Lines -->
  <line x1="120" y1="445" x2="392" y2="445" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="256" cy="445" r="3" fill="#F59E0B" />
</svg>
